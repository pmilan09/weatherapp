<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App - Weather Team</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
  crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
    <!--Drótos Gábor és Pető Milán-->
<body>

  <div class="app container">
    <header class="d-flex flex-column flex-sm-row justify-content-between align-items-stretch align-items-sm-center gap-3 mb-4">
  <h1>Időjárás</h1>

  <div class="search d-flex gap-2">
    <input id="cityInput" type="text" placeholder="Város neve..." value="Budapest">
    <button onclick="search()" title="Keresés">🔍</button>
  </div>
</header>

    <!-- ERROR -->

    <div id="error" class="error"></div>

    <!-- WEATHER -->

    <main id="weather">
      <div class="weather-card loading">
        Betöltés...
      </div>
    </main>

    <footer>
      Időjárási adatok: Open-Meteo
    </footer>
  </div>

  <script> // Pető Milán
    const URL_BASE_CITY     = "https://geocoding-api.open-meteo.com/v1/search";
    const URL_BASE_FORECAST = "https://api.open-meteo.com/v1/forecast";


    async function fetch_city(name) {
      name = name.trim();

      const url =
        URL_BASE_CITY +
        "?name=" +
        encodeURIComponent (name) +
        "&count=1" +
        "&language=hu" +
        "&format=json"
      ;

      const response = await fetch(url);

      if (!response.ok)
        throw Error(
          `Nem sikerült fetchelni (${url})`
        );

      const data = await response.json();

      if (!data.results || data.results.length === 0)
        throw new Error(
          `Nem található “${name}” város`
        );

      const place = data.results[0];

      return place;
    }


    async function fetch_weather(city) {
      const url =
        URL_BASE_FORECAST +
        "?latitude=" + city.latitude +
        "&longitude=" + city.longitude +

        "&current=" +

        "temperature_2m" +
        ",relative_humidity_2m" +
        ",apparent_temperature" +
        ",precipitation" +
        ",weather_code" +
        ",wind_speed_10m" +

        "&daily=" +

        "weather_code" +
        ",temperature_2m_max" +
        ",temperature_2m_min" +
        ",precipitation_probability_max" +
        ",sunrise" +
        ",sunset" +

        "&timezone=auto"
      ;

      const response = await fetch(url);

      if (!response.ok)
        throw Error(
          `Nem sikerült fetchelni (${url})`
        );

      const data = await response.json();

      return data;
    }


    function show_weather(city, weather) {
      const current = weather.current;
      const daily   = weather.daily;
      const code    = current.weather_code;

      hide_error();

      let forecastHTML = "";

      // Hét napjai
      for (let i = 0; i < 7; i++) {
        const now = new Date(daily.time[i]);

        const day_name = now.toLocaleDateString(
          "hu-HU",
          {
            weekday: "short"
          }
        );

        const temp_max = Math.round(daily.temperature_2m_max[i]);
        const temp_min = Math.round(daily.temperature_2m_min[i]);

        forecastHTML += `
  <div class="col-6 col-sm-4 col-md-3 col-lg">
    <div class="forecast-day">
      <div class="forecast-day-name">
        ${day_name}
      </div>

      <div class="forecast-day-temperature-max">
        ${temp_max}°
      </div>

      <div class="forecast-day-temperature-min">
        ${temp_min}°
      </div>
    </div>
  </div>
`;
      }

      const weatherelement = document.getElementById("weather");

      const now = new Date();

      const date_text =
        now.toLocaleDateString(
          "hu-HU",
          {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

      weatherelement.innerHTML = `
        <div class="weather-card">
          <div class="current-location">
            📍 ${city.name}, ${city.country}
          </div>

          <div class="current-date">
            ${date_text}
          </div>

          <div class="current d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div>
              <div class="current-temperature">
                ${Math.round(current.temperature_2m)}°C
              </div>
            </div>
          </div>

         <div class="current-details row g-3">
  <div class="col-12 col-sm-6 col-lg-3">
    <div class="current-detail">
      Hőérzet
      <strong>
        ${Math.round(current.apparent_temperature)}°C
      </strong>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-lg-3">
    <div class="current-detail">
      Páratartalom
      <strong>
        ${current.relative_humidity_2m}%
      </strong>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-lg-3">
    <div class="current-detail">
      Szél
      <strong>
        ${Math.round(current.wind_speed_10m)} km/h
      </strong>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-lg-3">
    <div class="current-detail">
      Csapadék
      <strong>
        ${current.precipitation} mm
      </strong>
    </div>
  </div>
</div>
        <div class="weather-card">
          <div class="forecast-title">
            7 napos előrejelzés
          </div>

         <div class="forecast row g-2">
  ${forecastHTML}
</div>
        </div>
      `;
    }


    function show_loading() {
      const weather = document.getElementById("weather");

      weather.innerHTML = `
        <div class="weather-card loading">
          Betöltés...
        </div>
      `;

      hide_error();
    }


    function show_error(message) {
      const error = document.getElementById("error");

      error.innerText = `HIBA: ${message}`;

      error.style.display = "block";
    }


    function hide_error() {
      const error = document.getElementById("error");

      error.style.display = "none";
    }


    async function search() {
      const input = document.getElementById("cityInput");

      show_loading ();

      let city, weather;

      try {
        city    = await fetch_city(input.value.trim());
        weather = await fetch_weather(city)
      } catch ({_, message}) {
        show_error(message);
        return;
      }

      show_weather(city, weather);
    }

    search();


    document.getElementById("cityInput").addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter")
          search();
      }
    );
  </script>
</body>

</html>
